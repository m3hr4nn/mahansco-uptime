services:
  dashboard:
    build: .
    entrypoint: ["python", "scripts/preview.py"]
    command: ["--data-dir", "/app/docs", "--bind", "0.0.0.0", "--port", "8080"]
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"

  monitor:
    build: .
    profiles: ["tools"]
    volumes:
      - "${MONITOR_DATA_DIR:-./runtime/data}:/data"

  project-dashboard:
    build: .
    profiles: ["project"]
    entrypoint: ["python", "scripts/preview.py"]
    command: ["--data-dir", "/data", "--bind", "0.0.0.0", "--port", "8080"]
    volumes:
      - "${MONITOR_DATA_DIR:-./runtime/data}:/data:ro"
    ports:
      - "${PROJECT_DASHBOARD_PORT:-8081}:8080"
