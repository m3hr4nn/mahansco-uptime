name: Uptime Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"  # best effort; offset avoids minute zero, not a cadence guarantee
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      test_ping:
        description: "Send a Telegram test message to verify delivery (token/chat id/bot admin)"
        type: boolean
        default: false
      send_digest:
        description: "Send the current-state digest to Telegram now (heartbeat on demand)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate configuration and behavior
        run: |
          python monitor.py --validate
          python -m unittest discover -s tests
          PYTHONPYCACHEPREFIX=/tmp/mahansco-uptime-pycache python -m py_compile monitor.py

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_PING:          ${{ inputs.test_ping }}
          FORCE_DIGEST:       ${{ inputs.send_digest }}
        run: python monitor.py

      - name: Persist state
        run: bash scripts/persist-state.sh

      - name: Preserve data if publication failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-recovery-${{ github.run_id }}
          path: |
            docs/state.json
            docs/history.json
            docs/uptime_daily.json
          retention-days: 7
