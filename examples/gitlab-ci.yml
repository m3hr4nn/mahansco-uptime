stages: [monitor]

monitor-public-site:
  stage: monitor
  image: docker:27-cli
  services:
    - docker:27-dind
  resource_group: independent-uptime-writer
  variables:
    STATE_BRANCH: main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache bash git
    - mkdir -p runtime
    - git clone --depth 1 --branch "$STATE_BRANCH" "$STATE_REPO_URL" runtime/data
  script:
    - docker build -t independent-uptime:$CI_PIPELINE_ID .
    - docker run --rm -v "$CI_PROJECT_DIR/runtime/data:/data" independent-uptime:$CI_PIPELINE_ID --config /app/examples/targets.example.json --data-dir /data
    - bash scripts/persist-external-state.sh runtime/data "$STATE_BRANCH"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - runtime/data/*.json
